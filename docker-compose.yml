services:
  agent:
    build: .
    image: agent-sandbox
    volumes:
      - agent-home:/home/agent      # persists venv, npm globals, agent config; sandbox.ps1 adds folders under /mnt
      - ./agent-config:/etc/agent-config:ro   # per-agent config, copied into $HOME on start
    # --- hardening ---
    read_only: true                 # root filesystem is immutable
    tmpfs:
      - /tmp:size=512m,exec         # exec: some installers build/run code from /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${SANDBOX_MEMORY:-4g}   # sandbox.ps1 -Memory
    cpus: ${SANDBOX_CPUS:-2}           # sandbox.ps1 -Cpus
    # Stronger kernel isolation if gVisor is installed on the host:
    # runtime: runsc

volumes:
  agent-home:
